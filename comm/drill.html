<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>金融常識與職業道德 刷題器</title>
<style>
:root{--bg:#f5f7f3;--sf:#ffffff;--cd:#d7ded8;--tx:#17211d;--mt:#66736d;--cy:#087a73;--gn:#4e7a3d;--vi:#315f94;--yw:#b66516;--rd:#b3453a}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans TC','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.wrap{max-width:660px;margin:0 auto;padding:10px 12px}

/* 模式列 */
.modes{display:flex;gap:5px;margin-bottom:8px}
.modes button{flex:1;border:1px solid var(--cd);background:var(--sf);color:var(--mt);border-radius:7px;padding:8px 2px;font-size:.79em;font-family:inherit;font-weight:700;cursor:pointer;line-height:1.3}
.modes button small{display:block;font-size:.8em;font-weight:400;opacity:.8}
.modes button.on{background:var(--cy);color:#fff;border-color:var(--cy)}
.modes button:disabled{opacity:.4}

header{position:sticky;top:0;background:var(--bg);z-index:20;padding-top:4px;padding-bottom:8px;border-bottom:1px solid var(--cd)}
.bar2{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
select,.btn{border:1px solid var(--cd);background:var(--sf);color:var(--tx);border-radius:6px;padding:5px 9px;font-size:.78em;font-family:inherit;cursor:pointer}
.btn.on{background:var(--cy);color:#fff;border-color:var(--cy)}
.prog{height:5px;background:var(--cd);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--cy);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;font-size:.71em;color:var(--mt);margin-top:4px;gap:8px}
.meta b{color:var(--rd)}

.card{background:var(--sf);border:1px solid var(--cd);border-radius:10px;padding:15px;margin-top:11px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px;font-size:.67em}
.tag{padding:2px 8px;border-radius:4px;background:rgba(8,122,115,.12);color:var(--cy);font-weight:700}
.tag.hot{background:rgba(182,101,22,.15);color:var(--yw)}
.tag.err{background:rgba(179,69,58,.13);color:var(--rd)}
.tag.src{background:var(--bg);color:var(--mt);font-weight:400}
.tag.new{background:rgba(49,95,148,.14);color:var(--vi)}
.why{border-left:3px solid var(--vi);background:rgba(49,95,148,.06);padding:8px 10px;border-radius:0 6px 6px 0;font-size:.8em;color:var(--tx);margin-bottom:9px}
.stem{font-size:1.01em;font-weight:600;margin-bottom:13px}
.opt{border:1px solid var(--cd);border-radius:8px;padding:10px 12px;margin-bottom:7px;font-size:.92em;display:flex;gap:9px;cursor:pointer;background:var(--sf);transition:background .12s}
.opt:active{background:var(--bg)}
.opt b{color:var(--mt);flex-shrink:0;font-variant-numeric:tabular-nums}
.opt.ans{border-color:var(--gn);background:rgba(78,122,61,.11)}
.opt.ans b{color:var(--gn)}
.opt.bad{border-color:var(--rd);background:rgba(179,69,58,.09)}
.opt.bad b{color:var(--rd)}
.opt.dim{opacity:.55}
.warn{border-left:3px solid var(--rd);background:rgba(179,69,58,.07);padding:8px 10px;border-radius:0 6px 6px 0;font-size:.78em;color:var(--rd);margin-bottom:9px}
.verdict{margin-top:10px;padding:9px 12px;border-radius:7px;font-size:.87em;font-weight:700}
.verdict.ok{background:rgba(78,122,61,.13);color:var(--gn)}
.verdict.no{background:rgba(179,69,58,.11);color:var(--rd)}
.hidden{display:none}

.acts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}
.acts .btn{padding:12px;font-size:.9em;font-weight:700;text-align:center}
.big{background:var(--cy);color:#fff;border-color:var(--cy)}
.full{grid-column:1/-1}

.panel{margin-top:11px}
.panel h3{font-size:.92em;margin:14px 0 6px;color:var(--vi)}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 9px;border-bottom:1px solid var(--cd);font-size:.82em;cursor:pointer;gap:8px}
.row:active{background:var(--sf)}
.row small{color:var(--mt);white-space:nowrap}
.rate{display:inline-block;min-width:42px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.r-bad{color:var(--rd)}.r-mid{color:var(--yw)}.r-good{color:var(--gn)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin:10px 0}
.kpi div{background:var(--sf);border:1px solid var(--cd);border-radius:8px;padding:10px 8px;text-align:center}
.kpi b{display:block;font-size:1.3em;color:var(--cy);font-variant-numeric:tabular-nums}
.kpi span{font-size:.68em;color:var(--mt)}
.empty{text-align:center;color:var(--mt);font-size:.85em;padding:26px 10px}
.foot{text-align:center;font-size:.69em;color:var(--mt);margin:20px 0;line-height:1.9}
a{color:var(--cy)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.hot{color:var(--rd)}
</style>
</head>
<body>
<div class="wrap">

<div class="modes">
  <button data-m="learn" class="on">背誦<small>直接看答案</small></button>
  <button data-m="quiz">測驗<small>作答後判定</small></button>
  <button data-m="wrong">錯題<small id="wcount">0</small></button>
  <button data-m="exam">模擬考<small>計時批改</small></button>
  <button data-m="stat">統計<small>弱點分析</small></button>
</div>

<header>
  <div class="bar2" id="bar2">
    <select id="subj"></select>
    <select id="topic"></select>
    <button class="btn" id="undone">只看未做</button>
    <button class="btn" id="toc">目錄</button>
    <button class="btn on" id="shuf" title="題序與選項位置隨機"><i class="xi xsh"></i> 洗牌</button>
    <span class="timer hidden" id="timer"></span>
    <button class="btn hidden" id="submit">交卷</button>
  </div>
  <div class="prog"><i id="pbar"></i></div>
  <div class="meta"><span id="pos"></span><span id="stat"></span></div>
</header>

<div id="view"></div>

<div class="foot">
  1120 題官方公告題庫（金融常識 504＋職業道德 616）・依考點分組排序<br>
  正式測驗從此題庫抽 100 題・答對 70 題及格・成績保留 5 年<br>
  作答紀錄存在本機瀏覽器（可在「統計」開啟雲端同步）・<a href="#" id="reset">清除全部紀錄</a><br><br>
  題目為官方公告之「金融市場常識與職業道德」測驗題庫，著作權屬台灣金融研訓院／證基會，僅供個人備考練習<br>
  <a href="https://www.sfi.org.tw/" target="_blank" rel="noopener">SFI 官方題庫下載</a>　·
  <a href="notes.html">衝刺筆記</a>　·
  <a href="analysis.html">題庫分析</a>　·
  <a href="../index.html">回總覽</a>
</div>
</div>

<script src="nav.js?v=2" defer></script>
<script src="sync.js?v=2"></script>
<script>
const KEY = 'comm-drill-v1';
const GRAD = 2;                       // 錯題連續答對幾次才「畢業」
let DECK = null;
let S = { q:{}, exams:[] };           // q[id] = {r:對次數, w:錯次數, s:連續對, seen:出現次數}
let mode = 'learn', subj = '職業道德', topicSel = 'ALL', onlyUndone = false;
let list = [], idx = 0, revealed = false, picked = null;
let exam = null, tick = null;

const $ = s => document.querySelector(s);
const md = t => t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');

/* ---------- 洗牌：選項位置隨機化 ----------
   以「題目 key + 本輪 seed」產生確定性排列：同一題在本輪內位置固定
   （回上一題不會變），換一輪才重排。關掉時維持原順序。 */
let shuffleOpt = true, shuffleQ = true, hideStale = false, seed = Date.now() % 100000;
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } }
function hash(str){ let h = 2166136261; for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function orderOf(o){
  const raw = o.q[4], ansRaw = o.q[5];
  if (!shuffleOpt) return { opts: raw, ans: ansRaw, map: [1,2,3,4] };
  let h = hash(o.k + ':' + seed);
  const idxs = [0,1,2,3];
  // xorshift32：不能用一般乘法 LCG（h*常數超過 double 精度會退化成固定排列）
  for (let i = 3; i > 0; i--){
    h ^= h << 13; h >>>= 0; h ^= h >> 17; h ^= h << 5; h >>>= 0;
    const j = h % (i+1); [idxs[i], idxs[j]] = [idxs[j], idxs[i]];
  }
  return { opts: idxs.map(i => raw[i]), ans: idxs.indexOf(ansRaw - 1) + 1, map: idxs };
}
const id = (sb, i) => sb[0] + i;
const rec = k => S.q[k] || {r:0,w:0,s:0,seen:0};
const isWrong = k => { const o = rec(k); return o.w > 0 && o.s < GRAD; };

function load(){ try{ const raw = JSON.parse(localStorage.getItem(KEY)); if(raw && raw.q) S = raw; }catch(e){} }
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); if (window.ExamSync) ExamSync.touch(); }

/* ---------- 題目集合 ---------- */
function pool(){
  const d = DECK[subj];
  let a = d.qs.map((q,i)=>({q,i,k:id(subj,i)}));
  if (mode === 'wrong'){
    let w = a.filter(o => isWrong(o.k));
    if (topicSel !== 'ALL') w = w.filter(o => d.topics[o.q[0]] === topicSel);
    return w;
  }
  if (topicSel !== 'ALL') a = a.filter(o => d.topics[o.q[0]] === topicSel);
  if (onlyUndone && mode !== 'exam') a = a.filter(o => rec(o.k).seen === 0);
  if (hideStale) a = a.filter(o => o.q[7] !== 2);          // 排除答案已作廢的題
  if (shuffleQ && mode !== 'learn') shuffle(a);            // 題序隨機
  return a;
}

function startExam(){
  // 正式測驗：綜合 100 題（依題庫比重 職業道德 55＋金融常識 45）、60 分鐘、答對 70 題及格
  const mins = 60;
  const plan = [['職業道德', 55], ['金融市場常識', 45]];
  let picked = [];
  for (const [sb, k] of plan){
    let all = DECK[sb].qs.map((q,i)=>({q,i,k:id(sb,i),subj:sb}));
    for (let i = all.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [all[i],all[j]] = [all[j],all[i]]; }
    picked = picked.concat(all.slice(0, Math.min(k, all.length)));
  }
  for (let i = picked.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [picked[i],picked[j]] = [picked[j],picked[i]]; }
  list = picked;
  exam = { answers:{}, end: Date.now() + mins*60000, n:list.length, submitted:false };
  idx = 0;
  clearInterval(tick);
  tick = setInterval(()=>{
    if (!exam || exam.submitted) return clearInterval(tick);
    const left = exam.end - Date.now();
    if (left <= 0){ submitExam(); return; }
    const m = Math.floor(left/60000), s = Math.floor(left%60000/1000);
    const t = $('#timer'); t.textContent = `${m}:${String(s).padStart(2,'0')}`;
    t.classList.toggle('hot', left < 5*60000);
  }, 500);
}

/* ---------- 渲染 ---------- */
function render(){
  $('#timer').classList.toggle('hidden', mode !== 'exam' || !exam || exam.submitted);
  $('#submit').classList.toggle('hidden', mode !== 'exam' || !exam || exam.submitted);
  $('#undone').classList.toggle('hidden', mode === 'wrong' || mode === 'exam' || mode === 'stat');
  $('#toc').classList.toggle('hidden', mode === 'exam' || mode === 'stat');
  $('#shuf').classList.toggle('hidden', mode === 'stat');
  $('#topic').classList.toggle('hidden', mode === 'exam' || mode === 'stat');

  if (mode === 'stat') return renderStat();
  if (mode === 'exam' && exam && exam.submitted) return renderResult();
  if (!list.length) return renderEmpty();

  const o = list[idx];
  const qSubj = o.subj || subj;
  const d = DECK[qSubj];
  const [t, cnt, src, stem, rawOpts, rawAns, warns, stale, why] = o.q;
  const { opts, ans } = orderOf(o);
  const r = rec(o.k);
  revealed = (mode === 'learn');
  picked = (mode === 'exam') ? (exam.answers[o.k] ?? null) : null;

  const inExam = mode === 'exam';
  $('#view').innerHTML = `
    <div class="card">
      <div class="tags">
        ${inExam?`<span class="tag src">${qSubj}</span>`:''}
        <span class="tag">${d.topics[t]}</span>
        ${cnt>1?`<span class="tag hot">回鍋 ${cnt} 次</span>`:''}
        ${(!inExam && r.w>0)?`<span class="tag err">錯過 ${r.w} 次</span>`:''}
        ${src==='模擬新題'?`<span class="tag new">模擬新題</span>`:`<span class="tag src">${src}</span>`}
        ${(stale===2)?`<span class="tag err"><i class="xd r"></i> 答案已作廢</span>`:(stale===1?`<span class="tag hot"><i class="xd y"></i> 存疑</span>`:'')}
      </div>
      ${(!inExam && warns.length)?warns.map(w=>`<div class="warn"><i class="xi xa y"></i> ${w}</div>`).join(''):''}
      ${(!inExam && why)?`<div class="why"><i class="xi xz v"></i> ${md(why)}</div>`:''}
      <div class="stem">${stem}</div>
      <div id="opts">${opts.map((v,i)=>`<div class="opt" data-i="${i+1}"><b>(${i+1})</b><span>${v}</span></div>`).join('')}</div>
      <div id="verdict"></div>
    </div>
    <div class="acts" id="acts"></div>`;

  $('#opts').querySelectorAll('.opt').forEach(el => el.onclick = () => pick(+el.dataset.i));
  if (mode === 'learn') showAnswer(false);
  if (inExam && picked) markPick(picked);
  drawActs();
  updateBars();
  window.scrollTo({top:0});
}

function drawActs(){
  const a = $('#acts');
  if (mode === 'exam'){
    a.innerHTML = `<button class="btn" id="prev">← 上一題</button><button class="btn big" id="next">下一題 →</button>`;
    $('#prev').onclick = () => go(-1); $('#next').onclick = () => go(1);
  } else if (mode === 'learn'){
    a.innerHTML = `<button class="btn" id="prev">← 上一題</button><button class="btn big" id="next">下一題（空白鍵）→</button>`;
    $('#prev').onclick = () => go(-1); $('#next').onclick = () => go(1);
  } else {
    a.innerHTML = revealed
      ? `<button class="btn" id="prev">← 上一題</button><button class="btn big" id="next">下一題 →</button>`
      : `<button class="btn" id="prev">← 上一題</button><button class="btn" id="skip">看答案（不計分）</button>`;
    $('#prev').onclick = () => go(-1);
    if (revealed) $('#next').onclick = () => go(1);
    else $('#skip').onclick = () => { showAnswer(false); revealed = true; drawActs(); };
  }
}

function pick(n){
  const o = list[idx];
  if (mode === 'exam'){ exam.answers[o.k] = n; markPick(n); updateBars(); return; }
  if (mode === 'learn' || revealed) return;
  const correct = (n === orderOf(o).ans);
  const r = {...rec(o.k)};
  r.seen++; if (correct){ r.r++; r.s++; } else { r.w++; r.s = 0; }
  S.q[o.k] = r; save();
  revealed = true;
  showAnswer(true, n, correct);
  drawActs(); updateBars(); refreshWrongCount();
}

function markPick(n){
  $('#opts').querySelectorAll('.opt').forEach(el => {
    el.classList.toggle('ans', +el.dataset.i === n);
  });
}

function showAnswer(judged, n, correct){
  const ans = orderOf(list[idx]).ans;
  $('#opts').querySelectorAll('.opt').forEach(el => {
    const i = +el.dataset.i;
    if (i === ans) el.classList.add('ans');
    else if (judged && i === n) el.classList.add('bad');
    else el.classList.add('dim');
  });
  if (judged){
    $('#verdict').innerHTML = correct
      ? `<div class="verdict ok"><i class="xi xk g"></i> 正確！${rec(list[idx].k).s >= GRAD ? '（已從錯題本畢業）' : ''}</div>`
      : `<div class="verdict no"><i class="xi xx r"></i> 答錯了，正解是 (${ans})　→ 已加入錯題本，答對 ${GRAD} 次才畢業</div>`;
  }
}

function go(step){
  if (idx + step < 0) return;
  if (idx + step >= list.length){
    if (mode === 'exam') return submitExam();
    alert('這一組做完了！');
    if (mode === 'wrong'){ build(); return; }
    return;
  }
  idx += step; render();
}

function updateBars(){
  const total = DECK[subj].qs.length;
  let seen = 0, right = 0, wrongPool = 0;
  for (let i = 0; i < total; i++){
    const r = rec(id(subj,i));
    if (r.seen) seen++;
    right += r.r;
    if (isWrong(id(subj,i))) wrongPool++;
  }
  if (mode === 'exam' && exam){
    const done = Object.keys(exam.answers).length;
    $('#pbar').style.width = done/exam.n*100 + '%';
    $('#pos').textContent = `第 ${idx+1} / ${exam.n} 題`;
    $('#stat').innerHTML = `已作答 ${done}／${exam.n}`;
  } else {
    $('#pbar').style.width = (list.length ? (idx+1)/list.length*100 : 0) + '%';
    $('#pos').textContent = list.length ? `${idx+1} / ${list.length}` : '—';
    $('#stat').innerHTML = `做過 ${seen}/${total}　錯題 <b>${wrongPool}</b>`;
  }
}

function refreshWrongCount(){
  let n = 0;
  for (const sb of Object.keys(DECK))
    for (let i = 0; i < DECK[sb].qs.length; i++) if (isWrong(id(sb,i))) n++;
  $('#wcount').textContent = n;
}

/* ---------- 模擬考批改 ---------- */
function submitExam(){
  clearInterval(tick);
  exam.submitted = true;
  let right = 0;
  list.forEach(o => {
    const pickd = exam.answers[o.k];
    const ok = pickd === orderOf(o).ans;
    const r = {...rec(o.k)};
    r.seen++; if (ok){ r.r++; r.s++; } else { r.w++; r.s = 0; }
    S.q[o.k] = r;
    if (ok) right++;
  });
  S.exams.unshift({ d:new Date().toISOString().slice(0,16).replace('T',' '), subj:'綜合測驗', right, total:list.length, score:right });
  S.exams = S.exams.slice(0,20);
  save(); refreshWrongCount(); render();
}

function renderResult(){
  const right = list.filter(o => exam.answers[o.k] === orderOf(o).ans).length;
  const score = right;                       // 100 題、每題 1 分
  const pass = score >= 70;
  const wrongs = list.filter(o => exam.answers[o.k] !== orderOf(o).ans);
  const byTopic = {};
  wrongs.forEach(o => { const sb = o.subj || subj; const t = DECK[sb].topics[o.q[0]]; const key = sb + '／' + t; byTopic[key] = (byTopic[key]||0)+1; });
  $('#view').innerHTML = `
    <div class="card" style="text-align:center">
      <div style="font-size:2.4em;font-weight:800;color:${pass?'var(--gn)':'var(--rd)'};font-variant-numeric:tabular-nums">${score}</div>
      <div style="font-size:.9em;color:var(--mt)">答對 ${right}／${list.length}　門檻 70 分</div>
      <div class="verdict ${pass?'ok':'no'}" style="margin-top:10px">${pass?'<i class="xi xk g"></i> 及格':`<i class="xi xx r"></i> 未達門檻，差 ${70-score} 分`}</div>
    </div>
    <div class="panel">
      <h3>錯題考點分布（${wrongs.length} 題）</h3>
      ${Object.entries(byTopic).sort((a,b)=>b[1]-a[1]).map(([t,n])=>
        `<div class="row"><span>${t}</span><small>錯 ${n} 題</small></div>`).join('') || '<div class="empty">全對！</div>'}
    </div>
    <div class="acts">
      <button class="btn full big" id="reviewWrong">複習這次的錯題 →</button>
      <button class="btn full" id="again">再考一次</button>
    </div>`;
  $('#reviewWrong').onclick = () => setMode('wrong');
  $('#again').onclick = () => { startExam(); render(); };
  $('#pbar').style.width = '100%';
  $('#pos').textContent = '批改完成';
  $('#stat').textContent = `綜合測驗　${right}/${list.length}`;
}

/* ---------- 統計 ---------- */
function renderStat(){
  let html = '';
  for (const sb of Object.keys(DECK)){
    const d = DECK[sb], total = d.qs.length;
    let seen = 0, r = 0, w = 0, pool = 0;
    const tp = {};
    d.qs.forEach((q,i) => {
      const o = rec(id(sb,i)), t = d.topics[q[0]];
      tp[t] = tp[t] || {r:0,w:0,seen:0,total:0,pool:0};
      tp[t].total++;
      if (o.seen){ seen++; tp[t].seen++; }
      r += o.r; w += o.w; tp[t].r += o.r; tp[t].w += o.w;
      if (isWrong(id(sb,i))){ pool++; tp[t].pool++; }
    });
    const acc = (r+w) ? r/(r+w)*100 : 0;
    html += `<h3>${sb}</h3>
      <div class="kpi">
        <div><b>${seen}</b><span>做過／${total}</span></div>
        <div><b>${acc.toFixed(0)}%</b><span>正確率</span></div>
        <div><b>${pool}</b><span>待複習錯題</span></div>
      </div>`;
    const wrows = Object.entries(tp).filter(([,v]) => v.pool > 0).sort((a,b) => b[1].pool - a[1].pool);
    if (wrows.length){
      html += `<div style="font-size:.72em;color:var(--mt);margin:6px 0 2px">待複習錯題分布（點考點直接刷該區錯題）</div>`;
      html += wrows.map(([t,v]) =>
        `<div class="row" data-wrong="1" data-sb="${sb}" data-t="${t}"><span>${t}</span>
         <span class="rate r-bad">${v.pool} 題</span></div>`).join('');
    }
    const rows = Object.entries(tp).filter(([,v]) => v.r+v.w > 0)
      .map(([t,v]) => [t, v.r/(v.r+v.w)*100, v.r+v.w, v.seen, v.total])
      .sort((a,b) => a[1]-b[1]);
    if (rows.length){
      html += `<div style="font-size:.72em;color:var(--mt);margin:6px 0 2px">各考點正確率（低→高，先補最上面的）</div>`;
      html += rows.map(([t,ac,n,seenN,tot]) => {
        const cls = ac < 60 ? 'r-bad' : ac < 75 ? 'r-mid' : 'r-good';
        return `<div class="row" data-sb="${sb}" data-t="${t}"><span>${t}<br><small>進度 ${seenN}/${tot}</small></span>
          <span><span class="rate ${cls}">${ac.toFixed(0)}%</span> <small>(${n} 次)</small></span></div>`;
      }).join('');
    } else html += `<div class="empty">還沒有作答紀錄</div>`;
  }
  const syncOn = window.ExamSync && ExamSync.enabled();
  html += `
  <h3>跨裝置同步</h3>
  <div style="font-size:.76em;color:var(--mt);line-height:1.75;margin-bottom:8px">
    <b>自動同步：</b>在每台裝置輸入<b>同一組通關密語</b>（自己取，8 字以上、別人猜不到），
    作答後幾秒自動上傳雲端，開頁自動合併。<span id="syncStat" style="color:var(--gn);font-weight:700"></span>
  </div>
  <div class="acts" style="grid-template-columns:1fr auto">
    <input id="syncPass" type="text" placeholder="通關密語（兩台裝置要一樣）" value="${syncOn ? ExamSync.getKey() : ''}"
      style="border:1px solid var(--cd);border-radius:6px;padding:10px 12px;font-size:.85em;font-family:inherit">
    <button class="btn ${syncOn?'':'big'}" id="syncGo">${syncOn ? '停用' : '啟用同步'}</button>
  </div>
  <div style="font-size:.72em;color:var(--mt);margin:10px 0 4px">手動備援（沒網路時用）：</div>
  <div class="acts" style="grid-template-columns:1fr 1fr">
    <button class="btn" id="expCode">複製進度碼</button>
    <button class="btn" id="impCode">貼上合併</button>
    <button class="btn full" id="expWrong">複製錯題清單（給 AI 分析）</button>
  </div>
  <textarea id="io" style="width:100%;height:78px;margin-top:8px;font-size:.7em;font-family:ui-monospace,monospace;
    border:1px solid var(--cd);border-radius:7px;padding:8px;display:none"></textarea>`;
  if (S.exams.length){
    html += `<h3>模擬考紀錄</h3>` + S.exams.map(e =>
      `<div class="row"><span>${e.d}　${e.subj}</span>
       <span class="rate ${e.score>=70?'r-good':'r-bad'}">${e.score} 分</span></div>`).join('');
  }
  $('#view').innerHTML = `<div class="panel">${html}</div>`;
  $('#view').querySelectorAll('.row[data-t]').forEach(el => el.onclick = () => {
    subj = el.dataset.sb; topicSel = el.dataset.t;
    fillSelects(); setMode(el.dataset.wrong ? 'wrong' : 'quiz');
  });
  $('#pbar').style.width = '0';
  $('#pos').textContent = '統計';
  $('#stat').textContent = '點考點可直接練該區';
  bindSync();
}

/* ---------- 跨裝置同步 ---------- */
function copyOut(text, btn, okMsg){
  const ta = $('#io'); ta.style.display = 'block'; ta.value = text; ta.select();
  const done = () => { const t = btn.innerHTML; btn.innerHTML = okMsg; setTimeout(() => btn.innerHTML = t, 1600); };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, done);
  else { try { document.execCommand('copy'); } catch(e){} done(); }
}

function mergeState(inc){
  let added = 0;
  for (const k in inc.q){
    const a = S.q[k], b = inc.q[k];
    if (!a){ S.q[k] = b; added++; }
    else {                                   // max-merge：同一份紀錄重複合併不會膨脹
      S.q[k] = { r: Math.max(a.r, b.r), w: Math.max(a.w, b.w), seen: Math.max(a.seen, b.seen), s: Math.max(a.s, b.s) };
      added++;
    }
  }
  const seen = new Set(S.exams.map(e => e.d + e.subj + e.score));
  (inc.exams || []).forEach(e => { if (!seen.has(e.d + e.subj + e.score)) S.exams.push(e); });
  save(); refreshWrongCount();
  return added;
}

function bindSync(){
  const ta = $('#io');
  if (window.ExamSync){
    if (window._syncStat) $('#syncStat').textContent = '　' + window._syncStat;
    $('#syncGo').onclick = () => {
      if (ExamSync.enabled()){ ExamSync.setKey(''); renderStat(); return; }
      const p = $('#syncPass').value.trim();
      if (p.length < 6) return alert('通關密語至少 6 個字，建議 8 字以上');
      ExamSync.setKey(p); renderStat();
    };
  }
  $('#expCode').onclick = e => copyOut(JSON.stringify(S), e.target, '<i class="xi xk g"></i> 已複製');
  $('#impCode').onclick = e => {
    ta.style.display = 'block';
    if (!ta.value.trim()){ ta.placeholder = '把另一台裝置複製的進度碼貼在這裡，再按一次「貼上合併」'; ta.focus(); return; }
    try {
      const inc = JSON.parse(ta.value.trim());
      if (!inc || !inc.q) throw 0;
      const n = mergeState(inc);
      ta.value = ''; alert('已合併 ' + n + ' 題的紀錄');
      renderStat();
    } catch(err){ alert('進度碼格式不正確，請確認完整複製'); }
  };
  $('#expWrong').onclick = e => {
    const lines = [];
    for (const sb of Object.keys(DECK)){
      const d = DECK[sb];
      d.qs.forEach((q, i) => {
        const o = rec(id(sb, i));
        if (o.w > 0) lines.push([sb, d.topics[q[0]], q[2], `對${o.r}錯${o.w}`, q[3].slice(0, 46)].join(' | '));
      });
    }
    if (!lines.length) return alert('目前沒有錯題紀錄');
    lines.sort();
    copyOut(['科目 | 考點 | 來源 | 對錯 | 題幹'].concat(lines).join(String.fromCharCode(10)), e.target, `<i class="xi xk g"></i> 已複製 ${lines.length} 題`);
  };
}

function renderEmpty(){
  const msg = mode === 'wrong'
    ? '目前沒有錯題 <br><br>用「測驗」模式作答，答錯的題會自動收集到這裡。<br>錯題要連續答對 ' + GRAD + ' 次才會畢業。'
    : '這個範圍沒有題目，試著取消篩選。';
  $('#view').innerHTML = `<div class="empty">${msg}</div>`;
  $('#pbar').style.width = '0'; $('#pos').textContent = '—';
  updateBars();
}

/* ---------- 控制 ---------- */
function build(){ list = pool(); idx = 0; render(); }

function setMode(m){
  mode = m;
  document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  if (m === 'exam'){ startExam(); render(); }
  else { clearInterval(tick); exam = null; build(); }
}

function fillSelects(){
  $('#subj').innerHTML = Object.keys(DECK).map(s => `<option${s===subj?' selected':''}>${s}</option>`).join('');
  $('#topic').innerHTML = '<option value="ALL">全部考點</option>' +
    DECK[subj].topics.map(t => `<option${t===topicSel?' selected':''}>${t}</option>`).join('');
}

document.querySelectorAll('.modes button').forEach(b => b.onclick = () => setMode(b.dataset.m));
$('#subj').onchange = e => { subj = e.target.value; topicSel = 'ALL'; fillSelects(); mode==='exam'?setMode('exam'):build(); };
$('#topic').onchange = e => { topicSel = e.target.value; build(); };
$('#undone').onclick = e => { onlyUndone = !onlyUndone; e.target.classList.toggle('on', onlyUndone); build(); };
$('#shuf').onclick = e => { shuffleOpt = shuffleQ = !shuffleOpt; e.target.classList.toggle('on', shuffleOpt);
  seed = Date.now() % 100000; build(); };
$('#submit').onclick = () => { if (confirm('確定交卷批改？')) submitExam(); };
$('#reset').onclick = e => { e.preventDefault(); if (confirm('清除所有作答紀錄與模擬考成績？')){ S = {q:{},exams:[]}; save(); refreshWrongCount(); build(); } };

$('#toc').onclick = () => {
  const d = DECK[subj];
  let html = '', n = 0;
  d.topics.forEach(t => {
    const g = d.qs.map((q,i)=>({q,i})).filter(o => d.topics[o.q[0]] === t);
    let seen = 0, wr = 0;
    g.forEach(o => { if (rec(id(subj,o.i)).seen) seen++; if (isWrong(id(subj,o.i))) wr++; });
    html += `<div class="row" data-t="${t}"><span>${n+1}–${n+g.length}　${t}</span>
      <small>${seen}/${g.length}${wr?`　<span style="color:var(--rd)">錯 ${wr}</span>`:''}</small></div>`;
    n += g.length;
  });
  $('#view').innerHTML = `<div class="panel">${html}</div>`;
  $('#view').querySelectorAll('.row[data-t]').forEach(el => el.onclick = () => {
    topicSel = el.dataset.t; $('#topic').value = topicSel; build();
  });
};

document.addEventListener('keydown', e => {
  if (mode === 'stat') return;
  if (e.key >= '1' && e.key <= '4'){ e.preventDefault(); pick(+e.key); return; }
  if (e.code === 'Space'){ e.preventDefault(); revealed || mode === 'learn' ? go(1) : $('#skip')?.click(); }
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft') go(-1);
});

load();
fetch('deck.json').then(r => r.json()).then(d => {
  DECK = d; fillSelects(); refreshWrongCount(); build();
  if (window.ExamSync) ExamSync.init({
    app: 'drill',
    getState: () => S,
    mergeInbound: inc => {
      if (!inc || !inc.q) return;
      mergeState(inc);
      if (mode === 'stat') renderStat();
      else if (mode !== 'exam'){ updateBars(); refreshWrongCount(); }
    },
    onStatus: t => { window._syncStat = t; const el = $('#syncStat'); if (el) el.textContent = t ? '　' + t : ''; }
  });
}).catch(e => { $('#view').innerHTML = `<div class="empty">deck.json 載入失敗：${e}</div>`; });
</script>
</body>
