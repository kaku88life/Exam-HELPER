<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>初階外匯 正確敘述挖空器</title>
<style>
:root{--bg:#f5f7f3;--sf:#ffffff;--cd:#d7ded8;--tx:#17211d;--mt:#66736d;--cy:#087a73;--gn:#607243;--vi:#315f94;--yw:#b66516;--rd:#b3453a}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans TC','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
.wrap{max-width:640px;margin:0 auto;padding:0 12px}

nav{position:sticky;top:0;background:var(--bg);z-index:30;padding:10px 0 8px;border-bottom:1px solid var(--cd)}
nav .row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;align-items:center}
nav .row::-webkit-scrollbar{display:none}
nav a,nav .chip{flex:0 0 auto;font-size:.74em;padding:5px 11px;border:1px solid var(--cd);border-radius:999px;background:var(--sf);text-decoration:none;color:var(--tx);white-space:nowrap;cursor:pointer;user-select:none}
nav .chip.on{background:var(--cy);color:#fff;border-color:var(--cy)}

h1{font-size:1.15em;margin:14px 0 3px}
.lede{color:var(--mt);font-size:.79em;margin-bottom:12px}

.bar{height:6px;background:var(--cd);border-radius:99px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--cy);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:.72em;color:var(--mt);margin-bottom:12px}

.card{background:var(--sf);border:1px solid var(--cd);border-radius:11px;padding:16px 16px 14px;margin-bottom:12px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.tag{font-size:.68em;padding:2px 8px;border-radius:4px;background:rgba(8,122,115,.1);color:var(--cy);font-weight:600}
.tag.k{background:rgba(49,95,148,.12);color:var(--vi)}
.tag.hot{background:rgba(182,101,22,.14);color:var(--yw)}
.stem{font-size:1.02em;line-height:1.95;letter-spacing:.2px}
.blank{display:inline-block;min-width:74px;text-align:center;border-bottom:2.5px solid var(--cy);color:var(--cy);font-weight:700;padding:0 6px}
.blank.filled{border-bottom-style:solid}
.blank.bad{border-bottom-color:var(--rd);color:var(--rd);text-decoration:line-through}

.opts{display:grid;gap:8px;margin-top:15px}
.opt{border:2px solid var(--cd);border-radius:9px;padding:12px 14px;font-size:.94em;background:var(--sf);cursor:pointer;user-select:none;transition:.12s;display:flex;align-items:center;gap:10px}
.opt:active{transform:scale(.99)}
.opt .n{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--cd);font-size:.72em;display:flex;align-items:center;justify-content:center;color:var(--mt)}
.opt.ok{border-color:var(--cy);background:rgba(8,122,115,.09)}
.opt.ok .n{background:var(--cy);color:#fff;border-color:var(--cy)}
.opt.no{border-color:var(--rd);background:rgba(179,69,58,.08);border-style:dashed}
.opt.dim{opacity:.42}
.opt:focus-visible{outline:3px solid var(--cy);outline-offset:2px}

.full{margin-top:14px;padding:12px 14px;border-left:4px solid var(--cy);background:rgba(8,122,115,.07);border-radius:0 8px 8px 0;font-size:.9em;line-height:1.85;display:none}
.full.show{display:block}
.full b{color:var(--cy)}
.full .lab{display:block;font-size:.78em;color:var(--mt);margin-bottom:4px;font-weight:600}
.full.wrong{border-left-color:var(--rd);background:rgba(179,69,58,.06)}
.full.wrong .lab{color:var(--rd)}

.acts{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--cd);padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:40}
.acts .in{max-width:640px;margin:0 auto;display:flex;gap:8px;width:100%}
.btn{flex:1;padding:12px 8px;border:1.5px solid var(--cd);border-radius:9px;background:var(--sf);font-size:.86em;font-weight:600;color:var(--tx);cursor:pointer;font-family:inherit}
.btn:active{background:var(--bg)}
.btn.pri{background:var(--cy);color:#fff;border-color:var(--cy);flex:2}
.btn.mas{background:rgba(96,114,67,.12);border-color:var(--gn);color:var(--gn)}
.btn.nav{flex:0 0 56px}
.btn:disabled{opacity:.35}

.panel{background:var(--sf);border:1px solid var(--cd);border-radius:10px;padding:14px 16px;margin-bottom:12px;display:none}
.panel.show{display:block}
.panel h3{font-size:.9em;margin-bottom:9px}
.panel .r{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px;align-items:center}
.panel label{font-size:.76em;color:var(--mt);width:100%;margin-bottom:2px}
textarea{width:100%;min-height:76px;font-family:'SF Mono',Consolas,monospace;font-size:.74em;padding:9px;border:1px solid var(--cd);border-radius:7px;background:var(--bg);resize:vertical}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin:10px 0}
.stat div{background:var(--bg);border:1px solid var(--cd);border-radius:8px;padding:9px;text-align:center}
.stat b{display:block;font-size:1.4em;color:var(--cy)}
.stat small{font-size:.68em;color:var(--mt)}
.done{text-align:center;padding:40px 16px;color:var(--mt);font-size:.9em}
.done b{display:block;font-size:1.3em;color:var(--cy);margin-bottom:8px}
.foot{margin:26px 0 10px;font-size:.72em;color:var(--mt);text-align:center;line-height:1.9}
a{color:var(--cy)}
</style>
</head>
<body>

<div class="wrap">
<nav><div class="row">
  <a href="drill.html">刷題器</a>
  <a href="remit-flow.html">匯兌流程</a>
  <a href="trade-flow.html">貿易流程</a>
  <a href="../index.html">總覽</a>
  <span class="chip" id="btnSet">⚙︎ 設定</span>
</div></nav>

<h1>正確敘述挖空器</h1>
<div class="lede">
本題庫<b>只收正確敘述</b>——每一句都直接取自官方考題中「正確」的那個選項，你不會讀到任何錯誤句子。
共 <span id="tot">—</span> 句，依考古題出現次數排序。
</div>

<div class="panel" id="setPanel">
  <h3>範圍</h3>
  <div class="r" id="fSubj"><label>科目</label></div>
  <div class="r" id="fKind"><label>挖空類型（可複選）</label></div>
  <div class="r" id="fScope"><label>練哪些</label></div>
  <h3 style="margin-top:14px">進度</h3>
  <div class="stat" id="statBox"></div>
  <div class="r">
    <button class="btn" id="expBtn">📤 複製進度碼</button>
    <button class="btn" id="impBtn">📥 貼上合併</button>
    <button class="btn" id="rstBtn">🗑 清除</button>
  </div>
  <textarea id="io" placeholder="換裝置時：在 A 機按「複製進度碼」，把碼貼到這裡，再按「貼上合併」" style="display:none"></textarea>
</div>

<div class="bar"><i id="barI"></i></div>
<div class="meta"><span id="mLeft">—</span><span id="mRight">—</span></div>

<div id="view"></div>

<div class="foot">
  <a href="drill.html">刷題器</a> · <a href="remit-flow.html">匯兌流程圖</a> · <a href="../index.html">回總覽</a><br>
  Built with Claude Code
</div>
</div>

<div class="acts"><div class="in" id="acts"></div></div>

<script>
(function(){
const KEY='fx-cloze-v1';
const $=s=>document.querySelector(s);
const KINDS={modal:'語氣（得／不得）',num:'數字',code:'代號',entity:'角色機構'};

let DATA=null, S={c:{}}, list=[], idx=0, picked=null, revealed=false;
let subj='國外匯兌', kinds=new Set(['modal','num','code','entity']), scope='todo';

/* ---------- 進度 ---------- */
function load(){ try{const r=JSON.parse(localStorage.getItem(KEY)); if(r&&r.c) S=r;}catch(e){} }
function save(){ localStorage.setItem(KEY,JSON.stringify(S)); }
const id=(sj,i)=>(sj==='國外匯兌'?'A':'B')+i;
function rec(k){ return S.c[k] || (S.c[k]={r:0,w:0,m:0}); }

/* ---------- 題目池 ---------- */
function pool(){
  const arr=DATA[subj].map((q,i)=>({q,i,k:id(subj,i)})).filter(o=>kinds.has(o.q[3]));
  if(scope==='todo')   return arr.filter(o=>{const r=S.c[o.k]; return !r || (!r.m && r.r===0);});
  if(scope==='wrong')  return arr.filter(o=>{const r=S.c[o.k]; return r && r.w>0 && !r.m;});
  if(scope==='master') return arr.filter(o=>{const r=S.c[o.k]; return r && r.m;});
  return arr.filter(o=>{const r=S.c[o.k]; return !r || !r.m;});   // all = 未掌握全部
}
function build(){ list=pool(); idx=0; render(); }

/* ---------- 畫面 ---------- */
function render(){
  picked=null; revealed=false;
  const n=list.length;
  $('#barI').style.width = n? ((idx)/n*100)+'%' : '0%';
  $('#mLeft').textContent = n? `第 ${idx+1} / ${n} 句` : '';
  const all=DATA[subj].length, mas=Object.keys(S.c).filter(k=>k[0]===(subj==='國外匯兌'?'A':'B')&&S.c[k].m).length;
  $('#mRight').textContent = `已掌握 ${mas} / ${all}`;

  if(!n){ $('#view').innerHTML=`<div class="done"><b>這一組沒有題目了 🎉</b>換個範圍，或到設定把「已掌握」放回來複習。</div>`; $('#acts').innerHTML=''; return; }
  if(idx>=n){ $('#view').innerHTML=`<div class="done"><b>這一輪跑完了 🎉</b>共 ${n} 句。<br>按下方「再跑一輪」會重新抓還沒掌握的。</div>`;
    $('#acts').innerHTML=`<button class="btn pri" id="again">再跑一輪</button>`; $('#again').onclick=build; return; }

  const o=list[idx], [text,ans,ds,kind,cnt,sess]=o.q;
  const opts=shuffle([ans,...ds], o.k);
  const hot = cnt>=3;
  $('#view').innerHTML=`
   <div class="card">
     <div class="tags">
       <span class="tag k">${KINDS[kind]}</span>
       <span class="tag ${hot?'hot':''}">考古題出現 ${cnt} 次</span>
       <span class="tag">${sess}</span>
       ${rec(o.k).w>0?'<span class="tag hot">錯過 '+rec(o.k).w+' 次</span>':''}
     </div>
     <div class="stem" id="stem">${text.replace('（＿＿）','<span class="blank" id="bk">＿＿</span>')}</div>
     <div class="opts" id="opts">
       ${opts.map((v,i)=>`<div class="opt" role="button" tabindex="0" aria-label="選項 ${i+1}：${esc(v)}" data-v="${esc(v)}"><span class="n">${i+1}</span><span>${v}</span></div>`).join('')}
     </div>
     <div class="full" id="full"></div>
   </div>`;
  $('#opts').querySelectorAll('.opt').forEach(el=>{
    el.onclick=()=>choose(el.dataset.v);
    el.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); choose(el.dataset.v); } };
  });
  drawActs();
}
function esc(s){ return s.replace(/"/g,'&quot;'); }
function shuffle(a,seedStr){
  let h=0; for(const ch of seedStr) h=(h*31+ch.charCodeAt(0))|0;
  const b=a.slice();
  for(let i=b.length-1;i>0;i--){ h=(h*1103515245+12345)&0x7fffffff; const j=h%(i+1); [b[i],b[j]]=[b[j],b[i]]; }
  return b;
}

function choose(v){
  if(revealed) return;
  revealed=true; picked=v;
  const o=list[idx], [text,ans]=o.q, r=rec(o.k), ok=(v===ans);
  const skipped=(v===null);
  ok? r.r++ : r.w++;
  save();
  const bk=$('#bk'); bk.textContent=skipped?ans:v; bk.classList.add('filled'); if(!ok&&!skipped) bk.classList.add('bad');
  $('#opts').querySelectorAll('.opt').forEach(el=>{
    if(el.dataset.v===ans) el.classList.add('ok');
    else if(!skipped && el.dataset.v===v) el.classList.add('no');
    else el.classList.add('dim');
  });
  const f=$('#full');
  f.className='full show'+(ok?'':' wrong');
  f.innerHTML = (ok? '<span class="lab">✅ 正確——完整句子再讀一次</span>'
                   : skipped? `<span class="lab">👀 正解是「${ans}」——把完整句子唸一次</span>`
                   : `<span class="lab">❌ 你選了「${v}」，正解是「${ans}」——把完整句子唸一次</span>`)
              + text.replace('（＿＿）',`<b>${ans}</b>`);
  drawActs();
}

function drawActs(){
  const r = list[idx]? rec(list[idx].k) : null;
  $('#acts').innerHTML=`
    <button class="btn nav" id="prev" ${idx===0?'disabled':''}>←</button>
    <button class="btn mas" id="mas">${r&&r.m?'↩︎ 取消掌握':'✓ 已掌握'}</button>
    <button class="btn pri" id="next">${revealed?'下一句 →':'不會，看答案'}</button>`;
  $('#prev').onclick=()=>{ if(idx>0){idx--;render();} };
  $('#mas').onclick=()=>{ const rr=rec(list[idx].k); rr.m=rr.m?0:1; save(); next(); };
  $('#next').onclick=()=>{ if(!revealed){ choose('␀'); } else next(); };
}
function next(){ idx++; render(); }

/* ---------- 篩選列 ---------- */
function chips(sel,items,get,set){
  const box=$(sel), lab=box.querySelector('label');
  box.innerHTML=''; box.appendChild(lab);
  items.forEach(([v,t])=>{
    const c=document.createElement('span');
    c.className='chip'+(get(v)?' on':''); c.textContent=t;
    c.onclick=()=>{ set(v); drawFilters(); build(); renderStat(); };
    box.appendChild(c);
  });
}
function drawFilters(){
  chips('#fSubj',[['國外匯兌','國外匯兌'],['進出口外匯','進出口外匯']],v=>subj===v,v=>{subj=v;});
  chips('#fKind',Object.entries(KINDS),v=>kinds.has(v),v=>{ kinds.has(v)?kinds.delete(v):kinds.add(v); if(!kinds.size) kinds.add(v); });
  chips('#fScope',[['todo','還沒做過'],['wrong','錯過的'],['all','全部未掌握'],['master','已掌握（複習）']],v=>scope===v,v=>{scope=v;});
}
function renderStat(){
  const p=subj==='國外匯兌'?'A':'B', all=DATA[subj].length;
  let m=0,w=0,r=0;
  for(const k in S.c){ if(k[0]!==p) continue; const x=S.c[k]; if(x.m)m++; if(x.w)w++; if(x.r||x.w)r++; }
  $('#statBox').innerHTML=`
    <div><b>${all}</b><small>總句數</small></div>
    <div><b>${r}</b><small>做過</small></div>
    <div><b>${m}</b><small>已掌握</small></div>
    <div><b>${w}</b><small>錯過</small></div>`;
}

/* ---------- 跨裝置：緊湊進度碼 ---------- */
function encode(){
  let out='';
  for(const sj of ['國外匯兌','進出口外匯']){
    const p=sj==='國外匯兌'?'A':'B';
    let s='';
    for(let i=0;i<DATA[sj].length;i++){
      const x=S.c[p+i];
      s += !x ? '0' : (x.m? '3' : (x.w? '2' : (x.r? '1':'0')));
    }
    out += p + s.replace(/(.)\1{2,}/g, m=>m[0]+'*'+m.length) + '|';
  }
  return 'CLZ1:'+out;
}
function decode(code){
  if(!code.startsWith('CLZ1:')) throw 0;
  const parts=code.slice(5).split('|').filter(Boolean); let n=0;
  for(const part of parts){
    const p=part[0], sj = p==='A'?'國外匯兌':'進出口外匯';
    let s=part.slice(1).replace(/(.)\*(\d+)/g,(m,c,k)=>c.repeat(+k));
    for(let i=0;i<s.length;i++){
      const v=s[i]; if(v==='0') continue;
      const k=p+i, x=rec(k);
      if(v==='3') x.m=1;
      else if(v==='2'){ x.w=Math.max(x.w,1); }
      else if(v==='1'){ x.r=Math.max(x.r,1); }
      n++;
    }
  }
  save(); return n;
}

/* ---------- 啟動 ---------- */
$('#btnSet').onclick=()=>{ $('#setPanel').classList.toggle('show'); $('#btnSet').classList.toggle('on'); renderStat(); };
$('#expBtn').onclick=e=>{
  const ta=$('#io'); ta.style.display='block'; ta.value=encode(); ta.select();
  if(navigator.clipboard) navigator.clipboard.writeText(ta.value).catch(()=>{});
  const t=e.target.textContent; e.target.textContent='✅ 已複製'; setTimeout(()=>e.target.textContent=t,1500);
};
$('#impBtn').onclick=e=>{
  const ta=$('#io'); ta.style.display='block';
  if(!ta.value.trim()){ ta.focus(); return; }
  try{ const n=decode(ta.value.trim()); ta.value=''; e.target.textContent=`✅ 合併 ${n} 筆`; setTimeout(()=>e.target.textContent='📥 貼上合併',1800); build(); renderStat(); }
  catch(err){ e.target.textContent='❌ 格式不對'; setTimeout(()=>e.target.textContent='📥 貼上合併',1800); }
};
$('#rstBtn').onclick=()=>{ if(confirm('清除本機所有挖空進度？')){ S={c:{}}; save(); build(); renderStat(); } };

document.addEventListener('keydown',e=>{
  if(/^[1-4]$/.test(e.key)){ const el=$('#opts')?.querySelectorAll('.opt')[+e.key-1]; el&&el.click(); }
  if(e.key==='ArrowRight'||e.code==='Space'){ e.preventDefault(); $('#next')?.click(); }
  if(e.key==='ArrowLeft') $('#prev')?.click();
  if(e.key==='m'||e.key==='M') $('#mas')?.click();
});

load();
fetch('cloze.json').then(r=>r.json()).then(d=>{
  DATA=d;
  $('#tot').textContent=(d['國外匯兌'].length+d['進出口外匯'].length);
  drawFilters(); renderStat(); build();
}).catch(()=>{ $('#view').innerHTML='<div class="done">載入 cloze.json 失敗</div>'; });
})();
</script>
</body>
</html>
