<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>初階外匯 事實挖空器</title>
<style>
:root{--bg:#f5f7f3;--sf:#ffffff;--cd:#d7ded8;--tx:#17211d;--mt:#66736d;--cy:#087a73;--gn:#4e7a3d;--vi:#315f94;--yw:#b66516;--rd:#b3453a}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans TC','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;
  padding-bottom:calc(88px + env(safe-area-inset-bottom))}
.wrap{max-width:640px;margin:0 auto;padding:10px 14px}

h1{font-size:1.28em;margin:8px 0 3px}
.lede{color:var(--mt);font-size:.8em;margin-bottom:12px;line-height:1.7}

.bar2{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
select,.chip{border:1px solid var(--cd);background:var(--sf);color:var(--tx);border-radius:7px;padding:7px 11px;font-size:.79em;font-family:inherit;cursor:pointer}
.chip.on{background:var(--cy);color:#fff;border-color:var(--cy)}
.chip.set{margin-left:auto}

.prog{height:5px;background:var(--cd);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--cy);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;font-size:.71em;color:var(--mt);margin:4px 0 8px;gap:8px}

.card{background:var(--sf);border:1px solid var(--cd);border-radius:11px;padding:16px;margin-top:4px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;font-size:.66em}
.tag{padding:2px 8px;border-radius:4px;background:rgba(8,122,115,.12);color:var(--cy);font-weight:700}
.tag.hot{background:rgba(182,101,22,.15);color:var(--yw)}
.tag.err{background:rgba(179,69,58,.13);color:var(--rd)}
.tag.src{background:var(--bg);color:var(--mt);font-weight:400}
.warn{border-left:3px solid var(--yw);background:rgba(182,101,22,.07);padding:7px 10px;border-radius:0 6px 6px 0;font-size:.76em;color:var(--yw);margin-bottom:9px}
.stem{font-size:1.02em;font-weight:600;margin-bottom:14px;line-height:1.8}
.blank{display:inline-block;min-width:66px;text-align:center;border-bottom:2.5px solid var(--cy);color:var(--cy);font-weight:800;padding:0 4px}
.blank.good{border-color:var(--gn);color:var(--gn)}
.blank.bad{border-color:var(--rd);color:var(--rd);text-decoration:line-through}

.opt{border:1.5px solid var(--cd);border-radius:10px;padding:13px 14px;margin-bottom:8px;font-size:.93em;display:flex;gap:10px;cursor:pointer;background:var(--sf);min-height:50px;align-items:center}
.opt:active{background:var(--bg)}
.opt b{color:var(--mt);flex-shrink:0}
.opt.ans{border-color:var(--gn);background:rgba(78,122,61,.11)}
.opt.ans b{color:var(--gn)}
.opt.bad{border-color:var(--rd);background:rgba(179,69,58,.09)}
.opt.bad b{color:var(--rd)}
.opt.dim{opacity:.5}

.full{margin-top:12px;border-left:3px solid var(--gn);background:rgba(78,122,61,.07);padding:11px 13px;border-radius:0 8px 8px 0;font-size:.9em;line-height:1.8;display:none}
.full.show{display:block}
.full b{color:var(--gn)}
.full small{display:block;color:var(--mt);font-size:.76em;margin-top:5px}

.acts{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--sf);border-top:1px solid var(--cd);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.acts .in{max-width:640px;margin:0 auto;display:flex;gap:8px}
.btn{flex:1;padding:13px 8px;border:1.5px solid var(--cd);border-radius:10px;background:var(--sf);font-size:.87em;font-weight:700;color:var(--tx);cursor:pointer;font-family:inherit;min-height:50px}
.btn:active{background:var(--bg)}
.btn.pri{background:var(--cy);color:#fff;border-color:var(--cy);flex:1.6}
.btn.mas{background:rgba(78,122,61,.12);border-color:var(--gn);color:var(--gn)}
.btn.nav{flex:0 0 58px}
.btn:disabled{opacity:.35}

.panel{background:var(--sf);border:1px solid var(--cd);border-radius:11px;padding:15px 16px;margin-bottom:12px;display:none}
.panel.show{display:block}
.panel h3{font-size:.9em;margin-bottom:9px;color:var(--vi)}
.panel .r{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px;align-items:center}
.panel label{font-size:.75em;color:var(--mt);width:100%;margin-bottom:2px}
.panel input[type=text]{flex:1;border:1px solid var(--cd);border-radius:7px;padding:10px 12px;font-size:.84em;font-family:inherit}
textarea{width:100%;min-height:76px;font-family:ui-monospace,Consolas,monospace;font-size:.72em;padding:9px;border:1px solid var(--cd);border-radius:7px;background:var(--bg);resize:vertical}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin:10px 0}
.stat div{background:var(--bg);border:1px solid var(--cd);border-radius:8px;padding:9px;text-align:center}
.stat b{display:block;font-size:1.4em;color:var(--cy)}
.stat small{font-size:.68em;color:var(--mt)}
.sy{font-size:.74em;color:var(--gn);font-weight:700;margin-top:4px;min-height:1.2em}
.done{text-align:center;padding:44px 16px;color:var(--mt);font-size:.9em}
.done b{display:block;font-size:1.25em;color:var(--cy);margin-bottom:8px}
.foot{margin:24px 0 10px;font-size:.71em;color:var(--mt);text-align:center;line-height:1.9}
a{color:var(--cy)}
</style>
</head>
<body>

<div class="wrap">

<h1>單一事實挖空器 <span style="font-size:.55em;color:var(--mt);font-weight:400">v2</span></h1>
<div class="lede">
750 題<b>單一事實型</b>考古題轉挖空——干擾項就是<b>官方原題的另外三個選項</b>（考場校準過，不再有單位不匹配的爛題）。
填入正解後的句子都是<b>正確敘述</b>，答錯會強制重讀完整正確句。依考古題出現次數排序。
</div>

<div class="bar2">
  <select id="subj"></select>
  <select id="topic"></select>
  <select id="scope">
    <option value="todo">還沒掌握的</option>
    <option value="wrong">錯過的</option>
    <option value="master">已掌握（複習）</option>
    <option value="all">全部</option>
  </select>
  <span class="chip set" id="btnSet"><i class="xi xset"></i> 設定</span>
</div>

<div class="panel" id="setPanel">
  <h3>挖空類型（可複選）</h3>
  <div class="r" id="fKind"></div>
  <h3>進度</h3>
  <div class="stat" id="statBox"></div>
  <h3>跨裝置同步</h3>
  <label style="font-size:.75em;color:var(--mt)">兩台裝置輸入同一組通關密語（與刷題器共用），進度自動雲端合併。</label>
  <div class="r" style="margin-top:6px">
    <input type="text" id="syncPass" placeholder="通關密語（8 字以上）">
    <button class="btn" style="flex:0 0 auto" id="syncGo">啟用</button>
  </div>
  <div class="sy" id="syncStat"></div>
  <div class="r" style="margin-top:8px">
    <button class="btn" id="expBtn"><i class="xi xup"></i> 複製進度碼</button>
    <button class="btn" id="impBtn"><i class="xi xdn"></i> 貼上合併</button>
    <button class="btn" id="rstBtn"><i class="xi xtr"></i> 清除</button>
  </div>
  <textarea id="io" placeholder="手動備援：在 A 機按「複製進度碼」，把碼貼到這裡，再按「貼上合併」" style="display:none"></textarea>
</div>

<div class="prog"><i id="barI"></i></div>
<div class="meta"><span id="mLeft">—</span><span id="mRight">—</span></div>

<div id="view"></div>

<div class="foot">
  資料源：deck.json 去重題庫中可乾淨轉換的單一事實型題（寧缺勿爛，無可信干擾項的不收）<br>
  題目為台灣金融研訓院公告之歷屆試題，著作權屬該院，僅供個人備考練習<br>
  <a href="drill.html">刷題器</a> · <a href="guide.html">作戰指南</a> · <a href="../index.html">回總覽</a>
</div>
</div>

<div class="acts"><div class="in" id="acts"></div></div>

<script src="nav.js" defer></script>
<script src="sync.js"></script>
<script>
(function(){
const KEY = 'fx-cloze-v2';
const $ = s => document.querySelector(s);
const KINDS = { modal:'語氣（得/不得）', num:'數字期限', code:'電文代號', entity:'角色機構' };

let DATA = null, S = { c:{} }, list = [], idx = 0, revealed = false;
let subj = '國外匯兌', topicSel = 'ALL', scope = 'todo', kinds = new Set(Object.keys(KINDS));

function load(){ try{ const r = JSON.parse(localStorage.getItem(KEY)); if (r && r.c) S = r; }catch(e){} }
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); if (window.ExamSync) ExamSync.touch(); }
const id = (sj,i) => (sj === '國外匯兌' ? 'A' : 'B') + i;
const rec = k => S.c[k] || { r:0, w:0, m:0 };

/* q = [挖空句, 答案, 干擾項[3], kind, 出現次數, 屆, 考點, 存疑] */
function pool(){
  let arr = DATA[subj].map((q,i)=>({q,i,k:id(subj,i)})).filter(o => kinds.has(o.q[3]));
  if (topicSel !== 'ALL') arr = arr.filter(o => o.q[6] === topicSel);
  if (scope === 'todo')   return arr.filter(o => { const r = S.c[o.k]; return !r || (!r.m && r.r === 0); });
  if (scope === 'wrong')  return arr.filter(o => { const r = S.c[o.k]; return r && r.w > 0 && !r.m; });
  if (scope === 'master') return arr.filter(o => { const r = S.c[o.k]; return r && r.m; });
  return arr;
}
function build(){ list = pool(); idx = 0; render(); }

/* 確定性洗選項：同一題本輪位置固定。
   內迴圈用 xorshift32（純 32-bit 位元運算）——不能用一般乘法 LCG，
   h*1103515245 會超過 double 精度、低位遭截斷，隨機數退化成常數（正解全落第 4 位的事故） */
function shuffle(items, key){
  let h = 2166136261;
  for (let i = 0; i < key.length; i++){ h ^= key.charCodeAt(i); h = Math.imul(h, 16777619); }
  h = h >>> 0;
  const a = items.slice();
  for (let i = a.length-1; i > 0; i--){
    h ^= h << 13; h >>>= 0; h ^= h >> 17; h ^= h << 5; h >>>= 0;
    const j = h % (i+1); [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
const esc = s => s.replace(/"/g,'&quot;').replace(/</g,'&lt;');

function render(){
  revealed = false;
  const n = list.length;
  $('#barI').style.width = n ? (idx/n*100) + '%' : '0%';
  $('#mLeft').textContent = n ? `第 ${idx+1} / ${n} 句` : '';
  const all = DATA[subj].length;
  const mas = Object.keys(S.c).filter(k => k[0] === (subj==='國外匯兌'?'A':'B') && S.c[k].m).length;
  $('#mRight').textContent = `已掌握 ${mas} / ${all}`;

  if (!n){
    $('#view').innerHTML = `<div class="done"><b>這一組沒有題目 </b>換個範圍或考點，或把「已掌握」放回來複習。</div>`;
    $('#acts').innerHTML = ''; return;
  }
  if (idx >= n){
    $('#view').innerHTML = `<div class="done"><b>這一輪跑完了 </b>共 ${n} 句。</div>`;
    $('#acts').innerHTML = `<button class="btn pri" id="again">再跑一輪</button>`;
    $('#again').onclick = build; return;
  }

  const o = list[idx], [text, ans, ds, kind, cnt, sess, topic, stale] = o.q;
  const opts = shuffle([ans, ...ds], o.k);
  const r = rec(o.k);
  $('#view').innerHTML = `
    <div class="card">
      <div class="tags">
        <span class="tag">${topic}</span>
        <span class="tag ${cnt>=3?'hot':''}">考 ${cnt} 次</span>
        <span class="tag src">${sess}</span>
        ${r.w > 0 ? `<span class="tag err">錯過 ${r.w} 次</span>` : ''}
      </div>
      ${stale ? `<div class="warn"><i class="xd y"></i> 近年修法相關，答案存疑——記觀念別死背數字</div>` : ''}
      <div class="stem" id="stem">${text.replace('（＿＿）','<span class="blank" id="bk">＿＿</span>')}</div>
      <div id="opts">${opts.map((v,i)=>`
        <div class="opt" role="button" tabindex="0" data-v="${esc(v)}"><b>(${i+1})</b><span>${v}</span></div>`).join('')}
      </div>
      <div class="full" id="full"></div>
    </div>`;
  $('#opts').querySelectorAll('.opt').forEach(el => {
    el.onclick = () => choose(el.dataset.v);
    el.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); choose(el.dataset.v); } };
  });
  drawActs();
  window.scrollTo({top:0});
}

function drawActs(){
  const a = $('#acts');
  if (!revealed){
    a.innerHTML = `
      <button class="btn nav" id="prev" ${idx===0?'disabled':''}>←</button>
      <button class="btn" id="skip">跳過看答案</button>`;
    $('#prev').onclick = () => { if (idx > 0){ idx--; render(); } };
    $('#skip').onclick = () => reveal(null);
  } else {
    const r = rec(list[idx].k);
    a.innerHTML = `
      <button class="btn nav" id="prev" ${idx===0?'disabled':''}>←</button>
      <button class="btn mas" id="mas">${r.m ? '<i class="xi xk"></i> 已掌握' : '<i class="xi xs y"></i> 標已掌握'}</button>
      <button class="btn pri" id="next">下一題 →</button>`;
    $('#prev').onclick = () => { if (idx > 0){ idx--; render(); } };
    $('#mas').onclick = () => {
      const k = list[idx].k, rr = {...rec(k)}; rr.m = rr.m ? 0 : 1; S.c[k] = rr; save(); drawActs();
    };
    $('#next').onclick = () => { idx++; render(); };
  }
}

function choose(v){
  if (revealed) return;
  const o = list[idx], ans = o.q[1];
  const ok = (v === ans);
  const r = {...rec(o.k)};
  if (ok) r.r++; else { r.w++; }
  S.c[o.k] = r; save();
  reveal(v);
}

function reveal(pickedV){
  revealed = true;
  const o = list[idx], [text, ans] = o.q;
  const ok = pickedV === ans;
  $('#opts').querySelectorAll('.opt').forEach(el => {
    const v = el.dataset.v.replace(/&quot;/g,'"').replace(/&lt;/g,'<');
    if (v === ans) el.classList.add('ans');
    else if (pickedV !== null && v === pickedV) el.classList.add('bad');
    else el.classList.add('dim');
  });
  const bk = $('#bk');
  bk.textContent = ans;
  bk.classList.add(pickedV === null ? 'good' : (ok ? 'good' : 'bad'));
  if (!ok){
    // 答錯或跳過 → 強制重讀完整正確句
    const fullText = text.replace('（＿＿）', '<b>' + ans + '</b>');
    const f = $('#full');
    f.innerHTML = '<i class="xi xbook c"></i> ' + fullText + '<small>讀一次完整的正確敘述再走。</small>';
    f.classList.add('show');
    if (pickedV !== null) bk.textContent = ans;
  }
  drawActs();
}

/* ---------- 控制列 ---------- */
function fillSelects(){
  $('#subj').innerHTML = Object.keys(DATA).map(s => `<option${s===subj?' selected':''}>${s}</option>`).join('');
  const topics = [...new Set(DATA[subj].map(q => q[6]))];
  $('#topic').innerHTML = '<option value="ALL">全部考點</option>' +
    topics.map(t => `<option${t===topicSel?' selected':''}>${t}</option>`).join('');
}
function fillKinds(){
  $('#fKind').innerHTML = Object.entries(KINDS).map(([k,v]) =>
    `<span class="chip ${kinds.has(k)?'on':''}" data-k="${k}">${v}</span>`).join('');
  $('#fKind').querySelectorAll('.chip').forEach(el => el.onclick = () => {
    const k = el.dataset.k;
    if (kinds.has(k) && kinds.size === 1) return;
    kinds.has(k) ? kinds.delete(k) : kinds.add(k);
    fillKinds(); fillStats(); build();
  });
}
function fillStats(){
  let tot = 0, mas = 0, wr = 0, done = 0;
  for (const sj of Object.keys(DATA)){
    DATA[sj].forEach((q,i) => {
      tot++;
      const r = S.c[id(sj,i)];
      if (r){ if (r.m) mas++; if (r.w > 0 && !r.m) wr++; if (r.r > 0 || r.m) done++; }
    });
  }
  $('#statBox').innerHTML = `
    <div><b>${tot}</b><small>總句數</small></div>
    <div><b>${done}</b><small>已答對過</small></div>
    <div><b>${wr}</b><small>待複習錯題</small></div>
    <div><b>${mas}</b><small>已掌握</small></div>`;
}

/* ---------- 同步（與 drill 共用密語） ---------- */
function mergeInbound(inc){
  if (!inc || !inc.c) return;
  for (const k in inc.c){
    const a = S.c[k], b = inc.c[k];
    S.c[k] = a
      ? { r: Math.max(a.r,b.r), w: Math.max(a.w,b.w), m: Math.max(a.m,b.m) }   // max-merge
      : b;
  }
  localStorage.setItem(KEY, JSON.stringify(S));
  fillStats(); build();
}
function refreshSyncUI(){
  const on = window.ExamSync && ExamSync.enabled();
  $('#syncPass').value = on ? ExamSync.getKey() : $('#syncPass').value;
  $('#syncGo').textContent = on ? '停用' : '啟用';
}
$('#syncGo').onclick = () => {
  if (!window.ExamSync) return;
  if (ExamSync.enabled()){ ExamSync.setKey(''); refreshSyncUI(); return; }
  const p = $('#syncPass').value.trim();
  if (p.length < 6) return alert('通關密語至少 6 個字，建議 8 字以上');
  ExamSync.setKey(p); refreshSyncUI();
};

/* ---------- 手動備援 ---------- */
function copyOut(text, btn, okMsg){
  const ta = $('#io'); ta.style.display = 'block'; ta.value = text; ta.select();
  const done = () => { const t = btn.innerHTML; btn.innerHTML = okMsg; setTimeout(() => btn.innerHTML = t, 1600); };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, done);
  else { try{ document.execCommand('copy'); }catch(e){} done(); }
}
$('#expBtn').onclick = e => copyOut(JSON.stringify(S), e.target, '<i class="xi xk g"></i> 已複製');
$('#impBtn').onclick = e => {
  const ta = $('#io');
  ta.style.display = 'block';
  if (!ta.value.trim()){ ta.focus(); return; }
  try{
    const inc = JSON.parse(ta.value.trim());
    if (!inc || !inc.c) throw 0;
    mergeInbound(inc); save();
    ta.value = ''; alert('已合併');
  }catch(err){ alert('進度碼格式不正確'); }
};
$('#rstBtn').onclick = () => { if (confirm('清除本機的挖空器紀錄？（雲端同步的紀錄不會刪）')){ S = {c:{}}; save(); fillStats(); build(); } };

/* ---------- 事件 ---------- */
$('#btnSet').onclick = () => { $('#setPanel').classList.toggle('show'); fillStats(); refreshSyncUI(); };
$('#subj').onchange = e => { subj = e.target.value; topicSel = 'ALL'; fillSelects(); build(); };
$('#topic').onchange = e => { topicSel = e.target.value; build(); };
$('#scope').onchange = e => { scope = e.target.value; build(); };
document.addEventListener('keydown', e => {
  if (e.key >= '1' && e.key <= '4'){
    const els = document.querySelectorAll('#opts .opt');
    if (els[+e.key-1] && !revealed){ e.preventDefault(); choose(els[+e.key-1].dataset.v); }
  }
  if (e.code === 'Space' && revealed){ e.preventDefault(); idx++; render(); }
});

/* ---------- 啟動 ---------- */
load();
fetch('cloze.json').then(r => r.json()).then(d => {
  DATA = d;
  fillSelects(); fillKinds(); build();
  if (window.ExamSync) ExamSync.init({
    app: 'cloze',
    getState: () => S,
    mergeInbound: mergeInbound,
    onStatus: t => { const el = $('#syncStat'); if (el) el.textContent = t; }
  });
}).catch(e => { $('#view').innerHTML = `<div class="done">cloze.json 載入失敗：${e}</div>`; });
})();
</script>
</body>
</html>
